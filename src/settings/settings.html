<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Translate — Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="app-header">
      <span class="app-logo">🌐</span>
      <div>
        <div class="app-title">AI Translate</div>
        <div class="app-subtitle">Settings & Configuration</div>
      </div>
    </div>

    <div class="app-body">
      <!-- Sidebar -->
      <nav class="sidebar">
        <a href="#providers" class="nav-item active" data-tab="providers">🔌 Providers</a>
        <a href="#prompts" class="nav-item" data-tab="prompts">📝 Prompts</a>
        <a href="#history" class="nav-item" data-tab="history">📜 History</a>
        <a href="#general" class="nav-item" data-tab="general">⚙️ General</a>
      </nav>

      <!-- Main Content -->
      <main class="content">
        <!-- Providers Tab -->
        <div class="tab-panel active" id="tab-providers">
          <div class="tab-header">
            <h2>Provider Profiles</h2>
            <button class="btn btn-primary" id="btn-add-provider">+ Add Provider</button>
          </div>
          <div id="provider-list" class="provider-list"></div>
          <div id="provider-form" class="provider-form" style="display:none;">
            <h3 id="form-title">Add Provider</h3>
            <div class="form-grid">
              <div class="form-group">
                <label>Profile Name</label>
                <input type="text" id="f-name" placeholder="My OpenAI">
              </div>
              <div class="form-group">
                <label>Provider Type</label>
                <select id="f-type">
                  <option value="openai-compatible">OpenAI Compatible</option>
                  <option value="anthropic">Anthropic</option>
                </select>
              </div>
              <div class="form-group">
                <label>Base URL</label>
                <input type="text" id="f-baseurl" placeholder="https://api.openai.com/v1">
              </div>
              <div class="form-group">
                <label>Model</label>
                <input type="text" id="f-model" placeholder="gpt-4o">
              </div>
              <div class="form-group form-full">
                <label>API Key</label>
                <div class="input-with-btn">
                  <input type="password" id="f-apikey" placeholder="sk-...">
                  <button class="btn btn-sm" id="btn-show-key" type="button">Show</button>
                </div>
              </div>
              <div class="form-group">
                <label>Temperature <span class="temp-val" id="temp-val">0.3</span></label>
                <input type="range" id="f-temp" min="0" max="2" step="0.1" value="0.3">
              </div>
              <div class="form-group form-actions">
                <button class="btn btn-test" id="btn-test">Test Connection</button>
                <div class="form-actions-right">
                  <button class="btn btn-cancel" id="btn-cancel">Cancel</button>
                  <button class="btn btn-primary" id="btn-save">Save</button>
                </div>
              </div>
            </div>
            <div id="test-result" class="test-result" style="display:none;"></div>
          </div>
        </div>

        <!-- Prompts Tab -->
        <div class="tab-panel" id="tab-prompts">
          <div class="tab-header">
            <h2>Prompt Templates</h2>
          </div>
          <div class="form-group form-full">
            <label>Default System Prompt</label>
            <textarea id="default-prompt" rows="3" class="prompt-editor"></textarea>
            <button class="btn btn-sm" id="btn-reset-prompt" style="margin-top:8px;">Reset to Default</button>
          </div>
          <div class="divider"></div>
          <div class="tab-header">
            <h3>Per-Language Templates</h3>
            <button class="btn btn-primary" id="btn-add-template">+ Add Template</button>
          </div>
          <div id="template-list" class="template-list"></div>
          <div id="template-form" class="provider-form" style="display:none;">
            <div class="form-grid">
              <div class="form-group">
                <label>Template Name</label>
                <input type="text" id="t-name" placeholder="English to Vietnamese">
              </div>
              <div class="form-group">
                <label>Source Language (* = any)</label>
                <input type="text" id="t-source" placeholder="en or *">
              </div>
              <div class="form-group">
                <label>Target Language</label>
                <input type="text" id="t-target" placeholder="vi">
              </div>
              <div class="form-group form-full">
                <label>System Prompt</label>
                <textarea id="t-prompt" rows="3" class="prompt-editor" placeholder="You are a professional translator..."></textarea>
              </div>
              <div class="form-group form-actions">
                <div></div>
                <div class="form-actions-right">
                  <button class="btn btn-cancel" id="btn-cancel-template">Cancel</button>
                  <button class="btn btn-primary" id="btn-save-template">Save</button>
                </div>
              </div>
            </div>
          </div>
          <div class="info-box">
            <strong>Template Variables:</strong>
            <code>{sourceLang}</code> <code>{targetLang}</code> <code>{text}</code>
          </div>
        </div>

        <!-- History Tab -->
        <div class="tab-panel" id="tab-history">
          <div class="tab-header">
            <h2>Translation History</h2>
            <div class="tab-header-actions">
              <input type="text" id="history-search" placeholder="Search..." class="search-input">
              <button class="btn btn-danger" id="btn-clear-history">Clear All</button>
            </div>
          </div>
          <div id="history-list" class="history-list"></div>
          <div id="history-empty" class="empty-state" style="display:none;">
            <p>No translation history yet</p>
          </div>
        </div>

        <!-- General Tab -->
        <div class="tab-panel" id="tab-general">
          <div class="tab-header"><h2>General Settings</h2></div>
          <div class="settings-grid">
            <div class="form-group">
              <label>Target Language</label>
              <select id="g-target-lang"></select>
            </div>
            <div class="form-group">
              <label>Selection Delay <span class="temp-val" id="delay-val">300ms</span></label>
              <input type="range" id="g-delay" min="100" max="1000" step="50" value="300">
            </div>
            <div class="form-group">
              <label>Tooltip Theme</label>
              <select id="g-theme">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="auto">Auto (match page)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Max History Size</label>
              <input type="number" id="g-max-history" min="10" max="5000" value="500">
            </div>
            <div class="form-group form-full">
              <label>Disabled Sites (one per line)</label>
              <textarea id="g-disabled-sites" rows="4" class="prompt-editor" placeholder="example.com&#10;another-site.com"></textarea>
            </div>
            <div class="form-group form-full">
              <label>Import / Export Settings</label>
              <div class="btn-row">
                <button class="btn" id="btn-export">Export Settings</button>
                <button class="btn" id="btn-import">Import Settings</button>
                <input type="file" id="import-file" accept=".json" style="display:none;">
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="settings.js"></script>
</body>
</html>
